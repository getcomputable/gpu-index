[project]
name = "gpu-index"
version = "0.1.0"
description = "Computable GPU Index (CGI): open collection, calculation, and publication of GPU rental price indices"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
publish = ["boto3>=1.36"]
dev = ["pytest>=8.0", "pyyaml>=6.0", "jsonschema>=4.26"]

[project.urls]
Homepage = "https://github.com/getcomputable/gpu-index"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpu_index"]
